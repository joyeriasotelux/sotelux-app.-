name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generar carpeta Android del proyecto
        run: flutter create --platforms=android --project-name sotelux_app .

      - name: Fijar versión estable de Kotlin
        run: |
          sed -i 's/org.jetbrains.kotlin.android" version "[^"]*"/org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle || true
          sed -i 's/id("org.jetbrains.kotlin.android") version "[^"]*"/id("org.jetbrains.kotlin.android") version "1.9.24"/' android/settings.gradle.kts || true

      - name: Reinstalar plataforma Android 35 (corrige jar corrupto del runner)
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --uninstall "platforms;android-35" || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35"

      - name: Instalar dependencias
        run: flutter pub get

      - name: Generar ícono de la app
        run: dart run flutter_launcher_icons

      - name: Compilar APK
        run: flutter build apk --release

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: sotelux-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk

name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generar carpeta Android del proyecto
        run: flutter create --platforms=android --project-name sotelux_app .

      - name: Mostrar archivos Gradle (diagnóstico)
        run: |
          echo "=== android/build.gradle ==="
          cat android/build.gradle 2>/dev/null || echo "(no existe)"
          echo "=== android/settings.gradle ==="
          cat android/settings.gradle 2>/dev/null || echo "(no existe)"

      - name: Fijar versión estable de Kotlin (raíz del proyecto)
        run: |
          sed -i -E "s/ext\.kotlin_version = ['\"][^'\"]*['\"]/ext.kotlin_version = '1.9.24'/" android/build.gradle || true
          sed -i 's/org.jetbrains.kotlin.android" version "[^"]*"/org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle || true
          sed -i 's/id("org.jetbrains.kotlin.android") version "[^"]*"/id("org.jetbrains.kotlin.android") version "1.9.24"/' android/settings.gradle.kts || true
          echo "=== android/build.gradle DESPUÉS ==="
          cat android/build.gradle 2>/dev/null || echo "(no existe)"

      - name: Forzar compileSdk y targetSdk a 34
        run: |
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i -E 's/^([[:space:]]*)compileSdk(Version)?.*/\1compileSdk = 34/' "$f"
              sed -i -E 's/^([[:space:]]*)targetSdk(Version)?.*/\1targetSdk = 34/' "$f"
            fi
          done

      - name: Instalar dependencias
        run: flutter pub get

      - name: Generar ícono de la app
        run: dart run flutter_launcher_icons

      - name: Compilar APK
        run: flutter build apk --release

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: sotelux-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk

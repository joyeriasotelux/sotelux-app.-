<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo Sotelux Joyería</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: -apple-system, Roboto, Arial, sans-serif;
  }
  header {
    padding: 24px 16px 12px;
  }
  .logo-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 4px;
  }
  .logo-img {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid rgba(212,175,55,0.4);
  }
  .logo-row h1 {
    font-size: 26px;
    margin: 0;
  }
  .subtitle {
    color: #999;
    font-size: 13px;
    margin: 0 0 16px;
  }
  .social-row {
    display: flex;
    gap: 8px;
    margin-bottom: 4px;
  }
  .social-btn {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 6px 12px;
    border: 1px solid #444;
    border-radius: 16px;
    color: #ddd;
    font-size: 11px;
    text-decoration: none;
    background: transparent;
    font-family: inherit;
    cursor: pointer;
  }
  .tabs {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 0 16px 12px;
  }
  .tab {
    flex-shrink: 0;
    padding: 8px 14px;
    border: 1px solid #444;
    border-radius: 20px;
    font-size: 13px;
    color: #aaa;
    cursor: pointer;
    background: transparent;
  }
  .tab.active {
    background: #fff;
    color: #000;
    border-color: #fff;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    padding: 0 16px 32px;
  }
  @media (min-width: 700px) {
    .grid { grid-template-columns: repeat(4, 1fr); }
  }
  .card {
    background: #141414;
    border: 1px solid #2a2a2a;
    border-radius: 12px;
    overflow: hidden;
  }
  .card img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    display: block;
    background: #222;
  }
  .img-wrap {
    position: relative;
  }
  .share-icon-btn {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    background: rgba(0,0,0,0.6);
    border: none;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cat-badge {
    display: inline-block;
    margin: 8px 8px 0;
    padding: 3px 8px;
    font-size: 10px;
    color: #d4af37;
    border: 1px solid rgba(212,175,55,0.5);
    border-radius: 10px;
  }
  .mat-badge {
    display: inline-block;
    margin: 8px 0 0 4px;
    padding: 3px 8px;
    font-size: 10px;
    color: #ddd;
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 10px;
  }
  .price {
    text-align: center;
    color: #d4af37;
    font-weight: bold;
    font-size: 14px;
    padding: 8px 6px 2px;
  }
  .stock-out {
    text-align: center;
    color: #888;
    font-size: 11px;
    padding: 2px 6px 8px;
  }
  .ask-btn {
    display: block;
    margin: 8px;
    padding: 8px;
    text-align: center;
    border: 1px solid #3ddc84;
    border-radius: 8px;
    color: #3ddc84;
    font-size: 12px;
    text-decoration: none;
  }
  .ask-btn.disabled {
    border-color: #444;
    color: #666;
    pointer-events: none;
  }
  .empty {
    text-align: center;
    color: #777;
    padding: 60px 20px;
    font-size: 14px;
  }
  footer {
    text-align: center;
    padding: 20px;
    color: #666;
    font-size: 12px;
  }
  footer a { color: #d4af37; }

  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 100;
    overflow-y: auto;
  }
  .lightbox.open { display: block; }
  .lightbox-close {
    position: fixed;
    top: 14px;
    right: 16px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    color: #fff;
    border: none;
    font-size: 20px;
    z-index: 101;
  }
  .lightbox-content {
    max-width: 500px;
    margin: 60px auto 40px;
    padding: 0 16px;
  }
  .lightbox-content img {
    width: 100%;
    border-radius: 12px;
    background: #222;
  }
  .lightbox-cat {
    color: #d4af37;
    font-size: 13px;
    margin-top: 16px;
    letter-spacing: 0.5px;
  }
  .lightbox-price {
    font-size: 26px;
    font-weight: bold;
    color: #fff;
    margin: 4px 0 16px;
  }
  .lightbox-caract {
    color: #ccc;
    font-size: 12px;
    margin: -10px 0 16px;
  }
  .lightbox-stock {
    font-size: 13px;
    margin-bottom: 16px;
  }
  .lightbox-stock.si { color: #3ddc84; }
  .lightbox-stock.no { color: #888; }
  .lightbox .ask-btn {
    margin: 0;
    padding: 14px;
    font-size: 14px;
  }
</style>
</head>

</header>

<div class="tabs" id="tabs"></div>
<div class="tabs" id="filtroMaterial"></div>
<div class="grid" id="grid"><p class="empty">Cargando catálogo…</p></div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" onclick="cerrarLightbox()">✕</button>
  <div class="lightbox-content" id="lightboxContent"></div>
</div>

<footer>
  Sotelux Joyería · <a href="https://wa.me/573183676909">WhatsApp</a>
</footer>

<script>
const PROJECT_ID = "sotelux-app";
const WHATSAPP_NUMBER = "573183676909";
const CATEGORIES = ["Anillos", "Cadenas", "Aretes y Topos", "Pulseras", "Conjuntos"];

let piezas = [];
let filtro = "Todos";
let filtroMaterial = "Todos";

function categoriaMaterial(material) {
  const set = new Set((material || "").split(",").map(s => s.trim()).filter(Boolean));
  const oro = set.has("Oro");
  const plata = set.has("Plata");
  if (oro && plata) return "Oro y Plata";
  if (oro) return "Oro";
  if (plata) return "Plata";
  return "";
}

function formatoCOP(valor) {
  const n = Number(valor);
  if (!valor || isNaN(n)) return "";
  return "$" + n.toLocaleString("es-CO");
}

function parseDoc(doc) {
  const f = doc.fields || {};
  const id = doc.name.split("/").pop();
  return {
    id: id,
    imageUrl: f.imageUrl ? f.imageUrl.stringValue : "",
    categoria: f.categoria ? f.categoria.stringValue : "Anillos",
    valorVenta: f.valorVenta ? f.valorVenta.stringValue : "",
    stock: f.stock ? f.stock.booleanValue !== false : true,
    material: f.material ? f.material.stringValue : "",
    piedra: f.piedra ? f.piedra.stringValue : "",
    tamanoPiedra: f.tamanoPiedra ? f.tamanoPiedra.stringValue : "",
    tamanoTotal: f.tamanoTotal ? f.tamanoTotal.stringValue : "",
  };
}

async function cargarCatalogo() {
  try {
    const url = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/piezas`;
    const res = await fetch(url);
    const data = await res.json();
    piezas = (data.documents || []).map(parseDoc);
  } catch (e) {
    document.getElementById("grid").innerHTML = '<p class="empty">No se pudo cargar el catálogo. Intenta de nuevo.</p>';
    return;
  }
  renderTabs();
  renderFiltroMaterial();
  render();
}

function renderTabs() {
  const tabsEl = document.getElementById("tabs");
  const opciones = ["Todos", ...CATEGORIES];
  tabsEl.innerHTML = opciones.map(cat => {
    const count = cat === "Todos" ? piezas.length : piezas.filter(p => p.categoria === cat).length;
    return `<button class="tab ${cat === filtro ? 'active' : ''}" data-cat="${cat}">${cat} (${count})</button>`;
  }).join("");
  tabsEl.querySelectorAll(".tab").forEach(btn => {
    btn.addEventListener("click", () => {
      filtro = btn.dataset.cat;
      renderTabs();
      render();
    });
  });
}

function renderFiltroMaterial() {
  const el = document.getElementById("filtroMaterial");
  const opciones = ["Todos", "Oro", "Plata", "Oro y Plata"];
  el.innerHTML = opciones.map(op => {
    return `<button class="tab mat-tab ${op === filtroMaterial ? 'active' : ''}" data-mat="${op}">${op}</button>`;
  }).join("");
  el.querySelectorAll(".mat-tab").forEach(btn => {
    btn.addEventListener("click", () => {
      filtroMaterial = btn.dataset.mat;
      renderFiltroMaterial();
      render();
    });
  });
}

function preguntarLink(p) {
  const precio = formatoCOP(p.valorVenta);
  const codigo = p.id.substring(0, 6);
  const texto = `Hola, me interesa esta pieza:\n${p.categoria} — código ${codigo}\nPrecio: ${precio || "consultar"}\n¿Está disponible?`;
  return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(texto)}`;
}

function formatoLista(valor) {
  if (!valor) return "";
  return valor.split(",").filter(Boolean).join(" y ");
}

function render() {
  const gridEl = document.getElementById("grid");
  let visibles = filtro === "Todos" ? piezas : piezas.filter(p => p.categoria === filtro);
  if (filtroMaterial !== "Todos") {
    visibles = visibles.filter(p => categoriaMaterial(p.material) === filtroMaterial);
  }

  if (visibles.length === 0) {
    gridEl.innerHTML = '<p class="empty">Aún no hay piezas en esta categoría.</p>';
    return;
  }

  gridEl.innerHTML = visibles.map(p => {
    const precio = formatoCOP(p.valorVenta);
    return `
      <div class="card" onclick="abrirLightbox('${p.id}')">
        <div class="img-wrap">
          <img src="${p.imageUrl}" loading="lazy" alt="${p.categoria}">
          <button class="share-icon-btn" onclick="compartirPieza(event, '${p.id}')" aria-label="Compartir pieza">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="18" cy="5" r="3"/>
              <circle cx="6" cy="12" r="3"/>
              <circle cx="18" cy="19" r="3"/>
              <line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/>
              <line x1="15.4" y1="6.5" x2="8.6" y2="10.5"/>
            </svg>
          </button>
        </div>
        <span class="cat-badge">${p.categoria}</span>
        ${p.material ? `<span class="mat-badge">${formatoLista(p.material)}</span>` : ""}
        <div class="price">${precio || "Consultar precio"}</div>
        ${p.stock
          ? `<a class="ask-btn" href="${preguntarLink(p)}" target="_blank" onclick="event.stopPropagation()">Preguntar</a>`
          : `<div class="stock-out">Sin inventario</div>`
        }
      </div>
    `;
  }).join("");
}

async function compartirPieza(e, id) {
  e.stopPropagation();
  const p = piezas.find(x => x.id === id);
  if (!p) return;

  const precio = formatoCOP(p.valorVenta) || "Consultar precio";
  const caract = [formatoLista(p.material), formatoLista(p.piedra), p.tamanoPiedra, p.tamanoTotal ? `Tamaño: ${p.tamanoTotal}` : ""]
    .filter(Boolean).join(" · ");
  const texto = `✨ Sotelux Joyería ✨\n${p.categoria}\nPrecio: ${precio}${caract ? "\n" + caract : ""}\n\n${window.location.href}`;

  try {
    const resp = await fetch(p.imageUrl);
    const blob = await resp.blob();
    const file = new File([blob], "pieza-sotelux.jpg", { type: blob.type || "image/jpeg" });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: "Sotelux Joyería", text: texto });
      return;
    }
  } catch (err) {}

  if (navigator.share) {
    navigator.share({ title: "Sotelux Joyería", text: texto }).catch(() => {});
  } else {
    navigator.clipboard.writeText(texto).then(() => {
      alert("Información de la pieza copiada. Pégala donde quieras enviarla.");
    });
  }
}

function abrirLightbox(id) {
  const p = piezas.find(x => x.id === id);
  if (!p) return;
  const precio = formatoCOP(p.valorVenta);
  const caract = [formatoLista(p.material), formatoLista(p.piedra), p.tamanoPiedra, p.tamanoTotal ? `Tamaño: ${p.tamanoTotal}` : ""]
    .filter(Boolean).join(" · ");
  document.getElementById("lightboxContent").innerHTML = `
    <img src="${p.imageUrl}" alt="${p.categoria}">
    <div class="lightbox-cat">${p.categoria.toUpperCase()}</div>
    <div class="lightbox-price">${precio || "Consultar precio"}</div>
    ${caract ? `<div class="lightbox-caract">${caract}</div>` : ""}
    <div class="lightbox-stock ${p.stock ? 'si' : 'no'}">${p.stock ? '● Disponible' : '● Sin inventario'}</div>
    ${p.stock
      ? `<a class="ask-btn" href="${preguntarLink(p)}" target="_blank">Preguntar por esta pieza</a>`
      : ''
    }
  `;
  document.getElementById("lightbox").classList.add("open");
}

function cerrarLightbox() {
  document.getElementById("lightbox").classList.remove("open");
}

function compartirCatalogo() {
  const datos = {
    title: "Catálogo Sotelux Joyería",
    text: "Mira el catálogo de Sotelux Joyería",
    url: window.location.href,
  };
  if (navigator.share) {
    navigator.share(datos).catch(() => {});
  } else {
    navigator.clipboard.writeText(datos.url).then(() => {
      alert("Enlace copiado. Pégalo donde quieras enviarlo.");
    });
  }
}

cargarCatalogo();
</script>
